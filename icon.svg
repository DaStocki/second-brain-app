  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#halo)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="168" stroke="#a4d8ff" stroke-opacity=".22" stroke-width="10"/>
    <circle cx="256" cy="256" r="122" stroke="url(#ring)" stroke-opacity=".7" stroke-width="12" stroke-dasharray="560 207" transform="rotate(-120 256 256)"/>
    <circle cx="256" cy="256" r="78" stroke="url(#ring)" stroke-width="14" stroke-dasharray="330 160" transform="rotate(35 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="44" fill="#a4d8ff" filter="url(#glow)" opacity=".9"/>
  <circle cx="256" cy="256" r="32" fill="url(#core)"/>
  <circle cx="374" cy="225" r="13" fill="#e9f4ff"/>
  <circle cx="374" cy="225" r="24" fill="#a4d8ff" opacity=".25"/>
  <circle cx="106" cy="356" r="9" fill="#a4d8ff" opacity=".75"/>
