<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4044"/><stop offset=".38" stop-color="#23272a"/><stop offset="1" stop-color="#15181a"/>
    </linearGradient>
    <radialGradient id="spill" cx="256" cy="-40" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3ccd5" stop-opacity=".38"/><stop offset="1" stop-color="#c3ccd5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#fff" fill-opacity=".035"/></pattern>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8f9"/><stop offset=".45" stop-color="#9ba2a8"/><stop offset=".55" stop-color="#5a6168"/><stop offset="1" stop-color="#c3ccd5"/>
    </linearGradient>
    <linearGradient id="chromeDim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6bdc3"/><stop offset="1" stop-color="#4a5055"/>
    </linearGradient>
    <radialGradient id="bezel" cx="256" cy="230" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e2e6ea"/><stop offset=".55" stop-color="#9aa0a6"/><stop offset=".8" stop-color="#55595e"/><stop offset="1" stop-color="#8f959b"/>
    </radialGradient>
    <radialGradient id="dome" cx="256" cy="240" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9ffcf"/><stop offset=".35" stop-color="#a6f593"/><stop offset=".7" stop-color="#7fe36a"/><stop offset="1" stop-color="#2d6a21"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#spill)"/>
  <rect width="512" height="512" fill="url(#scan)"/>
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="168" stroke="#e4e8eb" stroke-opacity=".14" stroke-width="10"/>
    <circle cx="256" cy="258" r="122" stroke="#000" stroke-opacity=".5" stroke-width="13" stroke-dasharray="560 207" transform="rotate(-120 256 258)" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="122" stroke="url(#chromeDim)" stroke-width="12" stroke-dasharray="560 207" transform="rotate(-120 256 256)"/>
    <circle cx="256" cy="258" r="80" stroke="#000" stroke-opacity=".5" stroke-width="15" stroke-dasharray="330 173" transform="rotate(35 256 258)" filter="url(#soft)"/>
    <circle cx="256" cy="256" r="80" stroke="url(#chrome)" stroke-width="14" stroke-dasharray="330 173" transform="rotate(35 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="52" fill="#7fe36a" opacity=".45" filter="url(#glow)"/>
  <circle cx="256" cy="259" r="44" fill="#000" opacity=".55" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="43" fill="url(#bezel)"/>
  <circle cx="256" cy="256" r="31" fill="url(#dome)"/>
  <ellipse cx="249" cy="243" rx="12" ry="7" fill="#fff" opacity=".55"/>
  <circle cx="374" cy="225" r="22" fill="#7fe36a" opacity=".35" filter="url(#glow)"/>
  <circle cx="374" cy="225" r="13" fill="url(#bezel)"/>
  <circle cx="374" cy="225" r="8" fill="#a6f593"/>
  <circle cx="106" cy="356" r="9" fill="url(#chromeDim)"/>
</svg>
