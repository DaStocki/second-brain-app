<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a8f"/><stop offset=".45" stop-color="#081d5c"/><stop offset="1" stop-color="#040d2a"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6fa4ec" stop-opacity=".55"/><stop offset=".45" stop-color="#2755b4" stop-opacity=".18"/><stop offset="1" stop-color="#040d2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="248" cy="246" r="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d6ecff"/><stop offset="1" stop-color="#8cc4ff"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
